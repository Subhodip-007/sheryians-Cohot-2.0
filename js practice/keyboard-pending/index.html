<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML & CSS Keyboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* General Body and Layout Styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

      
        #keyboard {
            background-color: #2d3748;
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 42rem; /* Adjusted for simpler layout */
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        /* Display Area */
        #display {
            background-color: #1a202c;
            color: white;
            font-size: 1.25rem;
            border-radius: 0.5rem;
            height: 4rem;
            padding: 0.75rem;
            border: 2px solid #4a5568;
            box-sizing: border-box;
            overflow-wrap: break-word;
            margin-bottom: 0.5rem;
        }

        /* Flexbox container for key rows */
        .key-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Base key styling */
        .key {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            height: 3rem;
            flex-grow: 1; /* Allow keys to take up space */
            font-size: 1rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease-in-out;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.2);
            transform: translateY(-2px);
            background-image: linear-gradient(to bottom, #4a5568, #2d3748);
        }
        .key:hover {
             background-image: linear-gradient(to bottom, #5a6578, #3d4758);
        }
        .key:active {
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
            transform: translateY(0);
        }
        
        /* Sizing utilities for specific keys */
        .key-grow-2 { flex-grow: 2; }
        .key-grow-8 { flex-grow: 8; }

    </style>
</head>
<body>

    
    <div id="keyboard">
        <div id="display">
            <input id="input" type="text" placeholder="Type here..." style="width: 100%; height: 100%; background: transparent; border: none; color: white; font-size: 1.25rem; outline: none;">
        </div>

      
        <div class="key-row">
            <div class="key">`</div> <div class="key">1</div> <div class="key">2</div> <div class="key">3</div> <div class="key">4</div> <div class="key">5</div> <div class="key">6</div> <div class="key">7</div> <div class="key">8</div> <div class="key">9</div> <div class="key">0</div> <div class="key">-</div> <div class="key">=</div> <div class="key key-grow-2">Backspace</div>
        </div>
       
        <div class="key-row">
            <div class="key key-grow-2">Tab</div> <div class="key">Q</div> <div class="key">W</div> <div class="key">E</div> <div class="key">R</div> <div class="key">T</div> <div class="key">Y</div> <div class="key">U</div> <div class="key">I</div> <div class="key">O</div> <div class="key">P</div> <div class="key">[</div> <div class="key">]</div> <div class="key">\</div>
        </div>
        
        <div class="key-row">
            <div class="key key-grow-2">Caps Lock</div> <div class="key">A</div> <div class="key">S</div> <div class="key">D</div> <div class="key">F</div> <div class="key">G</div> <div class="key">H</div> <div class="key">J</div> <div class="key">K</div> <div class="key">L</div> <div class="key">;</div> <div class="key">'</div> <div class="key key-grow-2">Enter</div>
        </div>
        
        <div class="key-row">
            <div class="key key-grow-2">Shift</div> <div class="key">Z</div> <div class="key">X</div> <div class="key">C</div> <div class="key">V</div> <div class="key">B</div> <div class="key">N</div> <div class="key">M</div> <div class="key">,</div> <div class="key">.</div> <div class="key">/</div> <div class="key key-grow-2">Shift</div>
        </div>
        
        <div class="key-row">
            <div class="key key-grow-8"></div>
        </div>
    </div>


</body>
</html>
