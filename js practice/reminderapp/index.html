<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
  <link rel="stylesheet" href="style.css">
  <title>Profile Card</title>
  <style>
    
  </style>
</head>
<body>
  <div class="container">
    <!-- Left side buttons -->
    <div class="side-buttons">
      <button id="add-btn"><i class="ri-add-line"></i></button>
      <button><i class="ri-arrow-up-line"></i></button>
      <button><i class="ri-arrow-down-line"></i></button>
    </div>

   <div class="allcard">
     <!-- Card -->
    <div class="card">
      <div class="profile">
        <img src="https://via.placeholder.com/50" alt="profile">
        <h2>name</h2>
      </div>

      <div class="info">
        <span>webpage role</span>
        <span>na</span>
      </div>
      <div class="info">
        <span>name</span>
        <span>example</span>
      </div>

      <div class="buttons">
        <button class="call">open</button>
        <button class="message"></button>
      </div>
    </div>
  </div>

  <!-- Right side palette -->
  <div class="palette">
    <button class="black"></button>
    <button class="purple"></button>
    <button class="brown"></button>
    <button class="teal"></button>
  </div>
</div>
  <!-- Form Modal -->
  <div id="form-modal" class="modal-container">
    <div class="form">
      <form id="add-card-form">
        <h2>Add New Contact</h2>
        <button type="button" id="close-form-btn" class="close-btn">&times;</button>
        <div class="form-field">
          <input type="text" id="name" placeholder="Name" required>
        </div>
        <div class="form-field">
          <input type="text" id="hometown" placeholder="website role" required>
        </div>
        <div class="form-field">
          <input type="text" id="bookings" placeholder=" website url" required>
        </div>
        <div class="form-field">
          <input type="text" id="image" placeholder="Image URL (optional)">
        </div>
        <button type="submit">Add Card</button>
      </form>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
  <script src="scripy.js"></script>
</body>
</html>
