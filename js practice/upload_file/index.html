<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <title>upload file</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }
        #input{
            display: none;
        }
        #main{
            background-color: rgb(222, 222, 222);
            padding: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 20px;

        }
        #btn{
            padding: 8px 10px;
            border-radius: 10px;
            border: none;
        }
        #btn:hover{
            background-color: #2fff00;
        }
        #cancel-btn{
            
        background: #ffffff00;
            border-radius: 10px;
            border: none;

        }
        .ri-close-circle-line{
            color: #000000;
        }
        .ri-close-circle-line:hover{
            color: #ff0000;
        }

     
        
    </style>
</head>
<body>
    <div id="main">
        <h1></h1>
        <h1 id="filename">upload file</h1>
        <input id="input" type="file">
        <div id="btn_con">
        <button id="btn">upload</button>
        <button id="cancel-btn"><i class="ri-close-circle-line"></i></button>    
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
