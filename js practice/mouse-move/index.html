<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        html,body{

        #box{
            position: absolute;
            top: 50%;
            left: 50%;

            height: 100px;
            width: 100px;
            background-color: aquamarine;
        }

    </style>
</head>
<body>
    <div id="box">

    </div>
