<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Hugeicons -->
  <link
    rel="stylesheet"
    href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css"
    crossorigin="anonymous"
  />

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Palette+Mosaic&family=Pixelify+Sans:wght@400..700&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
    rel="stylesheet"
  />

  <title>blank-v-1</title>
</head>


<body>

  <main id="main">


    <!-- =================================================
         FIXED BACKGROUND
    ================================================== -->

    <div id="bg-view-port">

      <!-- Normal paper -->
      <div class="grid-layer grid-light"></div>

      <!-- Inverted paper -->
      <div class="grid-layer grid-dark"></div>

      <!-- Wormhole -->
      <div class="wormhole-effect"></div>

    </div>



    <!-- =================================================
         FIXED NAVIGATION
    ================================================== -->

    <nav id="top-nav">

      <button
        id="nav-toggle"
        aria-label="Open menu"
      >

        <!-- Original icon -->

        <i
          class="
            nav-open-icon
            hgi
            hgi-stroke
            hgi-rounded
            hgi-bar-code-02
          "
        ></i>


        <!-- Cross -->

        <span class="nav-close-icon">
          <span></span>
          <span></span>
        </span>

      </button>

    </nav>



    <!-- =================================================
         NAVIGATION PANEL
    ================================================== -->

    <aside id="menu-panel">

      <div class="menu-header">

        <span>MENU</span>

      </div>


      <div class="menu-links">


        <a
          href="#about"
          class="menu-item"
        >

          <span
            class="menu-number number-orange"
          >
            01.
          </span>

          <span class="menu-title">
            ABOUT
          </span>

        </a>



        <a
          href="#projects"
          class="menu-item"
        >

          <span
            class="menu-number number-blue"
          >
            02.
          </span>

          <span class="menu-title">
            PROJECTS
          </span>

        </a>



        <a
          href="#resume"
          class="menu-item"
        >

          <span
            class="menu-number number-green"
          >
            03.
          </span>

          <span class="menu-title">
            RESUME
          </span>

        </a>



        <a
          href="#contact"
          class="menu-item"
        >

          <span
            class="menu-number number-white"
          >
            04.
          </span>

          <span class="menu-title">
            CONTACT
          </span>

        </a>


      </div>

    </aside>



    <!-- =================================================
         SCROLLING CONTENT
    ================================================== -->

    <div id="page-scroll">


      <!-- =================================================
           PAGE 1
      ================================================== -->

      <section id="page-1">

        <div class="hero-section">


          <h1 class="palette-mosaic-regular">

            BLANK-

            <span class="great-vibes-regular">
              folio
            </span>

          </h1>


          <p class="para yuyu-regular">

            a

            <span class="highlight">
              Full-Stack (MERN) Developer
            </span>

            from

            <span class="highlight">
              India 🇮🇳
            </span>,

            fighting bugs from India and

            (still searching for the time machine back to 2016).

          </p>



          <!-- =================================================
               EXPLORE BUTTON
          ================================================== -->

          <div id="explore-wrap">

            <svg
              id="explore-btn"
              viewBox="0 0 220 80"
              preserveAspectRatio="none"
            >

              <path id="button-shape"></path>

              <text
                x="110"
                y="46"
                text-anchor="middle"
              >
                Explore
              </text>

            </svg>

          </div>


          <span class="btn-statemant">
            Do you really expect this button works...
          </span>


        </div>

      </section>



      <!-- =================================================
           PAGE 2
      ================================================== -->

      <section
        class="page-2"
        id="about"
      >

        <h2>
          PAGE 2
        </h2>

      </section>



      <!-- =================================================
           PROJECTS
      ================================================== -->

      <section
        class="page-2"
        id="projects"
      >

        <h2>
          PROJECTS
        </h2>

      </section>



      <!-- =================================================
           RESUME
      ================================================== -->

      <section
        class="page-2"
        id="resume"
      >

        <h2>
          RESUME
        </h2>

      </section>



      <!-- =================================================
           CONTACT
      ================================================== -->

      <section
        class="page-2"
        id="contact"
      >

        <h2>
          CONTACT
        </h2>

      </section>


    </div>

  </main>


  <script
    type="module"
    src="/src/main.js"
  ></script>

</body>

</html>
