
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Board</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Navbar -->
        <nav class="navbar">
            <button id="openForm"><i class="fa-solid fa-plus"></i></button>
        </nav>


        <!-- Task Section -->
        <section class="task-section" id="taskList">

            
        </section>


        <!-- Add Task Form -->
        <div class="form-overlay" id="formOverlay">

            <form class="task-form" id="taskForm">

                <div class="form-heading">
                    <div>
                        <h2>Create New Task</h2>
                        <p>Add your task details below.</p>
                    </div>

                    <button type="button" id="closeForm"><i class="fa-solid fa-xmark"></i></button>
                </div>


                <div class="form-group">
                    <label>Task Name</label>
                    <input
                        type="text"
                        id="taskName"
                        placeholder="Enter task name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Description</label>
                    <textarea
                        id="taskDescription"
                        placeholder="Enter task description"
                        required
                    ></textarea>
                </div>


                <label class="form-check">
                    <input type="checkbox" id="taskCompleted">
                    Mark as completed
                </label>


                <div class="form-buttons">
                    <button type="button" id="cancelForm">Cancel</button>
                    <button id="submitButton">Create Task</button>
                </div>

            </form>

        </div>

    </main>
    <div class="status-section">
        <div class="heading">Logger</div>
        <div class="logger-section">

        </div>
    </div>
   
    <script src="app.js"></script>

</body>
</html>
