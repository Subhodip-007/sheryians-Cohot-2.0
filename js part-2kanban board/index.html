<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>KanBan</title>
</head>
<body>

<main class="h-screen w-full bg-black flex flex-col">

    <!-- Navbar -->
    <nav class="h-16 w-full flex items-center justify-between px-6 text-white font-mono">
        <h1 class="text-2xl font-bold">KanBan</h1>

        <button class="px-4 py-2 bg-zinc-900 rounded-xl hover:bg-zinc-700 transition">
            Add Task
        </button>
    </nav>

    <!-- Board -->
    <section class="flex-1 flex gap-5 bg-zinc-800 p-6">

        <!-- Todo -->
        <div id="Todo" class="flex flex-col flex-1 bg-blue-300 rounded-xl p-5">

            <div class="flex justify-between mb-4">
                <h1 class="font-bold text-lg">Todo</h1>
                <span>1</span>
            </div>

            <div class="tododrop flex-1 bg-black rounded-xl p-4 flex flex-col gap-3 overflow-y-auto transition-all duration-200">

                <div class="task bg-blue-400 rounded-2xl p-4 flex justify-between gap-4 cursor-grab shrink-0"
                    draggable="true">

                    <div>
                        <h2 class="font-bold text-xl">Task 1</h2>

                        <p class="mt-2">
                            Lorem ipsum dolor sit amet consectetur adipisicing elit.
                            Ea, autem expedita placeat eveniet dolores facilis.
                        </p>
                    </div>

                    <div class="flex items-end">
                        <button class="bg-red-500 px-4 py-2 rounded-xl text-white">
                            Delete
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <!-- In Progress -->
        <div id="In-process" class="flex flex-col flex-1 bg-blue-400 rounded-xl p-5">

            <div class="flex justify-between mb-4">
                <h1 class="font-bold text-lg">In Progress</h1>
                <span>0</span>
            </div>

            <div class="inprogdrop flex-1 bg-black rounded-xl p-4 transition-all duration-200 overflow-y-auto">

            </div>

        </div>

        <!-- Completed -->
        <div id="completed" class="flex flex-col flex-1 bg-blue-500 rounded-xl p-5">

            <div class="flex justify-between mb-4">
                <h1 class="font-bold text-lg">Completed</h1>
                <span>0</span>
            </div>

            <div class=" completedrop flex-1 bg-black rounded-xl p-4 transition-all duration-200 overflow-y-auto">

            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
